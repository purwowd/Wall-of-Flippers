name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile WallofFlippers.py utils/*.py tests/*.py
      - name: Install web deps
        run: pip install fastapi uvicorn jinja2
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Web module compile
        run: python -m py_compile web/app.py run_web.py utils/wof_engine.py

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bleak
      - run: python -m unittest discover -s tests -p "test_*.py" -v
