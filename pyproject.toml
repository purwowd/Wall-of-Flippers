[project]
name = "wall-of-flippers"
version = "2.0.0"
description = "Discover Flipper Zero devices and BLE advertisement attacks"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
linux = ["bluepy"]
mac = ["bleak>=0.21"]
windows = ["bleak>=0.21"]
dev = ["pytest>=7.0"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "jinja2>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
